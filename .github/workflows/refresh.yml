name: Refresh profile

# Re-renders every asset and the README from live GitHub data.
#
# Authenticates with the workflow's built-in token, so there is no personal
# access token to create or rotate. Contribution figures are read from the
# public profile graph rather than the GraphQL calendar, which means they match
# what a visitor sees regardless of which token runs the job.

on:
  schedule:
    # 05:17 UTC. An odd minute, because everything scheduled on the hour
    # queues behind everything else scheduled on the hour.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render assets and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md
          if git diff --quiet --cached; then
            echo "Nothing changed."
          else
            git commit -m 'chore: refresh profile assets'
            git push
          fi
